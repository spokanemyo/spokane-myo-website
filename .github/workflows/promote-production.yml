name: Promote test to production

run-name: Production promotion requested by ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == 'janderson133' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      test_sha: ${{ steps.revision.outputs.test_sha }}

    steps:
      - name: Check out the test candidate
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: false

      - name: Capture the exact test revision
        id: revision
        shell: bash
        run: echo "test_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build the production candidate
        run: npm run build

  promote:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Check out the trusted promotion code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Promote the verified test revision
        env:
          EXPECTED_TEST_SHA: ${{ needs.validate.outputs.test_sha }}
          PROMOTER_APP_ID: ${{ vars.PRODUCTION_PROMOTER_APP_ID }}
          PROMOTER_PRIVATE_KEY: ${{ secrets.PRODUCTION_PROMOTER_PRIVATE_KEY }}
        run: node tools/promote-production.mjs
